<!-- 將舊的 Header 取代為： -->
    <div class="header" id="main-header">
        <div style="width: 70px; display:flex; align-items:center;">
            <button class="btn-icon" id="btn-menu" onclick="toggleSideMenu()">☰</button>
            <button class="btn-icon" id="btn-back" onclick="handleBack()" style="display: none;">⇠</button>
        </div>
        <div class="header-center" style="display:flex; flex-direction:column; align-items:center;">
            <h1 id="header-title" style="pointer-events:none; margin: 0;">預設使用者</h1>
            <span id="shift-status-badge" class="badge" style="background:var(--timer-bg); font-size:0.75rem; padding:2px 6px; margin-top:2px; font-weight:normal; border:1px solid var(--border); display: none; white-space: nowrap;">未上線</span>
        </div>
        <div style="width: 70px; text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 8px;">
            <button class="btn-icon" id="btn-search" onclick="openFilterModal()" style="display:none; margin: 0; padding: 4px; font-size: 1.2rem;">📅</button>
        </div>
    </div>
